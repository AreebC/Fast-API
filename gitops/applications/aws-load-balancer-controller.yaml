apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: aws-load-balancer-controller
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: 1.8.1

      helm:
        releaseName: aws-load-balancer-controller

        valueFiles:
          - $values/gitops/apps/aws-load-balancer-controller/values.yaml

        parameters:
          - name: clusterName
            value: fastapi-eks-cluster

          - name: region
            value: us-east-1

          - name: vpcId
            value: vpc-0ed49b56c2881f264
           
    - repoURL: https://github.com/AreebC/Fast-API.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true