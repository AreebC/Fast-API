loki:
  enabled: true

  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      region: us-east-1
      endpoint: s3.amazonaws.com

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: boltdb-shipper
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  compactor:
    enabled: true
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 2

  limits_config:
    retention_period: 168h  

  ruler:
    storage:
      type: s3
      s3:
        region: us-east-1
        endpoint: s3.amazonaws.com

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: gp3

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

serviceAccount:
  create: false
  name: loki-sa

service:
  type: ClusterIP
  port: 3100

chunksCache:
  enabled: false

resultsCache:
  enabled: false
