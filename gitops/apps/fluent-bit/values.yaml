service:
  flush: 5
  daemon: Off
  log_level: info

inputs:
  tail:
    enabled: true
    path: /var/log/containers/*.log
    parser: cri
    tag: kube.*
    memBufLimit: 10MB
    skipLongLines: On
    refreshInterval: 10

filters:
  kubernetes:
    enabled: true
    match: kube.*
    Kube_URL: https://kubernetes.default.svc:443
    Kube_Tag_Prefix: kube.var.log.containers.
    merge_log: On
    merge_log_key: log
    K8S-Logging.Parser: On
    K8S-Logging.Exclude: Off

  parser:
    enabled: true
    match: kube.*
    key_name: log
    reserve_data: On
    parsers: json

parsers:
  enabled: true
  regex: []
  json:
    - name: json
      time_key: time
      time_format: "%Y-%m-%dT%H:%M:%S"
      decode_field_as: json log

outputs:
  loki:
    enabled: true
    match: kube.*
    host: loki.monitoring.svc.cluster.local
    port: 3100
    labels: |
      job=fluent-bit
      namespace=${kubernetes['namespace_name']}
      pod=${kubernetes['pod_name']}
      container=${kubernetes['container_name']}
    auto_kubernetes_labels: On
    line_format: json
    removeKeys: kubernetes,stream

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
